# BrewCult — PROD compose (deployment_guide.md §5.2, EF §7.2)
#
# Topology: web / api / worker / scheduler / postgres / redis / minio /
# minio-init / migrate, plus an OPTIONAL caddy behind the `edge` profile.
# Deployed by infra/deploy.sh (rsync + server-side build, ADR-003). Secrets live
# in /srv/brewcult/.env.prod — never in the repo.
#
# ── WHY EVERY SERVICE IS NAMED `brewcult-…` ──────────────────────────────────
# BrewCult shares a host with Zentra (ADR-002: microservice-READY, one box until
# it hurts). Zentra's compose already defines services literally called `web`,
# `api`, `postgres` and `redis`. Docker's embedded DNS resolves a name across
# EVERY network a container is attached to, so the moment one Caddy is attached
# to both stacks, a bare `web` has two answers and gets round-robined between
# two different applications. That failure is intermittent, silent, and serves
# Zentra's HTML to BrewCult visitors — so the service names are fully qualified
# here rather than relying on network isolation to disambiguate them.
# Service name == container_name throughout, so `docker compose ps` and
# `docker ps` agree.
#
# ── EDGE / TLS ───────────────────────────────────────────────────────────────
# On the shared host the EXISTING Caddy (zentra-caddy) is the single TLS
# terminator: it already owns :80/:443 and holds the ACME account. It reaches
# this stack over the external `edge` network, which is why web/api/minio join
# it. The caddy service below is therefore behind the `edge` PROFILE — it stays
# stopped unless you explicitly ask for it:
#     docker compose -f docker-compose.prod.yml --profile edge up -d
# That is the standalone-host path (BrewCult alone on its own VPS). Starting it
# on the shared box would fight zentra-caddy for :443 and fail to bind.
#
# Migration rule (§5.2): migrate must FAIL LOUDLY — api/worker/scheduler only
# start after `brewcult-migrate` exits 0 (condition: service_completed_successfully).
#
# NEVER run `docker compose down -v` on prod: the postgres and minio volumes are
# the actual user data, and brewcult_caddy_data holds Let's Encrypt certs + the
# ACME account (rate-limited to re-issue). All are in the nightly backup set.

services:
  brewcult-caddy:
    image: caddy:2-alpine
    container_name: brewcult-caddy
    restart: unless-stopped
    profiles: ["edge"] # standalone-host only — see the EDGE note above
    ports:
      - "80:80" # must stay open — ACME HTTP-01 (§5.3)
      - "443:443"
      - "443:443/udp" # HTTP/3
    dns: # explicit resolvers — Zentra lesson (ACME lookups on minimal hosts)
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - brewcult_caddy_data:/data # certificates + ACME account (PERSIST — backup set)
      - brewcult_caddy_config:/config
    networks:
      - default
      - edge
    depends_on:
      brewcult-web:
        condition: service_started

  brewcult-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-} # empty → same-origin /api via Caddy
        API_INTERNAL_URL: http://brewcult-api:4000
    container_name: brewcult-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      API_INTERNAL_URL: http://brewcult-api:4000
    env_file:
      - ../.env.prod
    networks:
      - default
      - edge # reachable by the host's shared Caddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      brewcult-api:
        condition: service_healthy

  brewcult-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.prod
    container_name: brewcult-api
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ../.env.prod
    networks:
      - default
      - edge # Caddy proxies /api/* straight here
    healthcheck: # /healthz contract — F-20
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      brewcult-migrate:
        condition: service_completed_successfully # fail-loud gate (§5.2)
      brewcult-postgres:
        condition: service_healthy
      brewcult-redis:
        condition: service_started
      brewcult-minio:
        condition: service_started

  brewcult-worker: # outbox relay + event consumers — same image as api, different entrypoint
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.prod
    container_name: brewcult-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ../.env.prod
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dist/worker.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      brewcult-migrate:
        condition: service_completed_successfully
      brewcult-postgres:
        condition: service_healthy
      brewcult-redis:
        condition: service_started
      brewcult-minio:
        condition: service_started

  brewcult-scheduler: # cron: retention jobs, digests, backups — same image as api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.prod
    container_name: brewcult-scheduler
    restart: unless-stopped
    command: ["node", "dist/scheduler.js"]
    env_file:
      - ../.env.prod
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dist/scheduler.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      brewcult-migrate:
        condition: service_completed_successfully
      brewcult-postgres:
        condition: service_healthy
      brewcult-redis:
        condition: service_started

  brewcult-postgres:
    image: pgvector/pgvector:pg16
    container_name: brewcult-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - brewcult_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  brewcult-redis:
    image: redis:7-alpine
    container_name: brewcult-redis
    restart: unless-stopped
    volumes:
      - brewcult_redis:/data

  brewcult-minio:
    image: minio/minio:latest
    container_name: brewcult-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000" # reached only via media.brewcult.coffee through Caddy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    networks:
      - default
      - edge # media.brewcult.coffee is served through the shared Caddy
    volumes:
      - brewcult_minio:/data

  brewcult-minio-init: # one-shot bucket bootstrap
    image: minio/mc:latest
    container_name: brewcult-minio-init
    depends_on:
      - brewcult-minio
    env_file:
      - ../.env.prod
    volumes:
      - ./:/infra
    entrypoint: ["/bin/sh", "/infra/minio-create-bucket.sh"]
    restart: "no"

  brewcult-migrate: # one-shot: applies db/migrations/*.sql BEFORE api starts (§5.2)
    image: pgvector/pgvector:pg16
    container_name: brewcult-migrate
    env_file:
      - ../.env.prod # provides DATABASE_URL (brewcult-postgres:5432 on this network)
    environment:
      MIGRATIONS_DIR: /db/migrations
    volumes:
      - ../db:/db:ro
    entrypoint: ["/bin/sh", "/db/migrate.sh"]
    depends_on:
      brewcult-postgres:
        condition: service_healthy
    restart: "no"

networks:
  default: # private: postgres, redis, worker, scheduler never leave this one
  edge:
    external: true # shared with the host's TLS terminator; created out-of-band
    # Created once per host with `docker network create edge`. It is declared
    # external rather than compose-managed so that `docker compose down` on
    # EITHER stack cannot delete the network the other stack is still using.

volumes:
  brewcult_pgdata:
  brewcult_redis:
  brewcult_minio:
  brewcult_caddy_data: # precious: certs + ACME account — nightly backup set (standalone mode)
  brewcult_caddy_config:
