# BrewCult — DEV compose (deployment_guide.md §3)
#
# Zentra pattern: source bind-mounted into plain node:22-alpine containers,
# `npm run dev` inside — every file save hot-reloads, no image rebuild.
# Named volumes shadow node_modules so host OS (Windows) and container (Linux)
# never share binaries.
#
# Usage:  cp .env.example .env  &&  cd infra && docker compose up

services:
  web:
    image: node:22-alpine
    container_name: brewcult-web
    working_dir: /app
    command: sh -c "npm install && npm --workspace apps/web run dev"
    ports:
      - "3000:3000"
    volumes:
      - ..:/app # bind mount: edit locally, runs in container
      - web_node_modules:/app/node_modules
    env_file:
      - ../.env
    depends_on:
      - api

  api:
    image: node:22-alpine
    container_name: brewcult-api
    working_dir: /app
    command: sh -c "npm install && npm --workspace apps/api run dev"
    ports:
      - "4000:4000"
    volumes:
      - ..:/app
      - api_node_modules:/app/node_modules
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    image: node:22-alpine
    container_name: brewcult-worker
    working_dir: /app
    command: sh -c "npm install && npm --workspace apps/api run worker:dev"
    volumes:
      - ..:/app
      - worker_node_modules:/app/node_modules
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  scheduler:
    image: node:22-alpine
    container_name: brewcult-scheduler
    working_dir: /app
    command: sh -c "npm install && npm --workspace apps/api run scheduler:dev"
    volumes:
      - ..:/app
      - scheduler_node_modules:/app/node_modules
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: brewcult-postgres
    environment:
      POSTGRES_USER: brewcult
      POSTGRES_PASSWORD: brewcult
      POSTGRES_DB: brewcult
    ports:
      - "5433:5432" # host 5433 → container 5432 (avoids clashing with a host Postgres)
    volumes:
      - brewcult_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: brewcult-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: brewcult-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - brewcult_minio:/data

  minio-init:
    image: minio/mc:latest
    container_name: brewcult-minio-init
    depends_on:
      - minio
    env_file:
      - ../.env
    volumes:
      - ./:/infra
    entrypoint: ["/bin/sh", "/infra/minio-create-bucket.sh"]
    restart: "no"

  mailpit: # dev mail catcher — deployment_guide.md §8.5; UI at http://localhost:8025
    image: axllent/mailpit:latest
    container_name: brewcult-mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP (SMTP_HOST=mailpit, SMTP_PORT=1025 in .env)

  # Optional one-shot migration runner for dev (same fail-loud runner as prod).
  # Not started by `docker compose up` (profile-gated); run explicitly:
  #   docker compose --profile tools run --rm migrate
  migrate:
    image: pgvector/pgvector:pg16
    container_name: brewcult-migrate
    profiles: ["tools"]
    env_file:
      - ../.env
    environment:
      MIGRATIONS_DIR: /db/migrations
    volumes:
      - ../db:/db:ro
    entrypoint: ["/bin/sh", "/db/migrate.sh"]
    depends_on:
      - postgres
    restart: "no"

volumes:
  brewcult_pgdata:
  brewcult_minio:
  web_node_modules:
  api_node_modules:
  worker_node_modules:
  scheduler_node_modules:
